<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#11131b"/><text x="64" y="74" fill="#f2f1ef" font-family="Arial" font-size="33" font-weight="700">GEROSCIENCE INTERVENTION EVIDENCE ENGINE</text><text x="64" y="113" fill="#b5aee8" font-family="Arial" font-size="18">Rank hypotheses by evidence, translation, safety, uncertainty, and robustness</text><g font-family="Arial"><rect x="70" y="190" width="260" height="390" rx="22" fill="#1a1e2a" stroke="#746bd1" stroke-width="3"/><text x="100" y="235" fill="#dedbf8" font-size="21" font-weight="700">EVIDENCE</text><text x="100" y="291" fill="#aab0bd" font-size="18">study design</text><text x="100" y="337" fill="#aab0bd" font-size="18">species</text><text x="100" y="383" fill="#aab0bd" font-size="18">replication</text><text x="100" y="429" fill="#aab0bd" font-size="18">uncertainty</text><text x="100" y="475" fill="#aab0bd" font-size="18">safety</text><text x="100" y="521" fill="#aab0bd" font-size="18">hallmarks</text><path d="M350 385 H470" stroke="#9a94e7" stroke-width="5"/><path d="M450 370 L474 385 L450 400" fill="none" stroke="#9a94e7" stroke-width="5"/><rect x="490" y="225" width="260" height="320" rx="22" fill="#211c31" stroke="#c18de5" stroke-width="3"/><text x="620" y="278" fill="#f0ddfa" font-size="21" font-weight="700" text-anchor="middle">SYNTHESIS</text><text x="620" y="337" fill="#c4b3d1" font-size="18" text-anchor="middle">reliability weights</text><text x="620" y="381" fill="#c4b3d1" font-size="18" text-anchor="middle">translation discount</text><text x="620" y="425" fill="#c4b3d1" font-size="18" text-anchor="middle">bootstrap interval</text><text x="620" y="469" fill="#c4b3d1" font-size="18" text-anchor="middle">source ablation</text><path d="M770 385 H878" stroke="#d3a4ef" stroke-width="5"/><path d="M858 370 L882 385 L858 400" fill="none" stroke="#d3a4ef" stroke-width="5"/><rect x="900" y="190" width="235" height="390" rx="22" fill="#182526" stroke="#61c8aa" stroke-width="3"/><text x="1017" y="235" fill="#dffaf2" font-size="21" font-weight="700" text-anchor="middle">OUTPUT</text><text x="1017" y="310" fill="#9fd8c8" font-size="18" text-anchor="middle">priority score</text><text x="1017" y="360" fill="#9fd8c8" font-size="18" text-anchor="middle">90% interval</text><text x="1017" y="410" fill="#9fd8c8" font-size="18" text-anchor="middle">robustness</text><text x="1017" y="460" fill="#9fd8c8" font-size="18" text-anchor="middle">evidence gaps</text><text x="1017" y="510" fill="#9fd8c8" font-size="18" text-anchor="middle">ranked hypotheses</text></g><text x="600" y="670" fill="#d7c5a0" font-family="Arial" font-size="18" text-anchor="middle">A research-priority model—not a clinical recommendation or a claim of human lifespan extension</text></svg>
